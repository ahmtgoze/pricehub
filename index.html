<!doctype html>
<html lang="tr" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d1d1f'/><text x='50' y='68' font-size='62' font-family='-apple-system,Arial,sans-serif' font-weight='600' fill='white' text-anchor='middle'>P</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>PriceHub</title>
    <script>
      // Tema tercihini React yuklenmeden once uygula: aksi halde koyu tema
      // secili kullanicida sayfa bir an beyaz parliyor.
      (function () {
        try {
          var t = localStorage.getItem('pricehub-tema');
          if (t === 'koyu' || (t === 'sistem' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* localStorage kapaliysa acik tema */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
